spring:
  application:
    name: vault
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vault}}
    username: ${POSTGRES_USER:${DB_USERNAME:postgres}}
    password: ${POSTGRES_PASSWORD:${DB_PASSWORD:vault_password}}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  docker:
    compose:
      file: compose.yaml
      skip-in-tests: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  telegram:
    enabled: ${TELEGRAM_ENABLED:true}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    allowed-user-ids: ${ALLOWED_USER_IDS:}
  crypto:
    encryption-key: ${CARD_ENCRYPTION_KEY:}

logging:
  level:
    uz.card.vault: INFO
    org.springframework.boot: INFO
    org.liquibase: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
