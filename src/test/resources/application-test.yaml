spring:
  application:
    name: vault-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  liquibase:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  telegram:
    enabled: false
  crypto:
    encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

logging:
  level:
    uz.card.vault: DEBUG
